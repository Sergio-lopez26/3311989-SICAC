<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylesOdontologo.css">
    <link rel="icon" type="image/x-icon" href="LogoIcono.png">
    <title>Registro Odontólogo</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark" style="height: 60px;">
        <div class="container-fluid">
            <img id="logo" src="logo.png" alt="Logo">
            <a class="navbar-brand">SICAC</a>
            <div class="collapse navbar-collapse" id="navbarColor01">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                <a class="nav-link active" href="Odontologo.html">Odontólogos</a>
                </li>
                <li class="nav-item">
                <a class="nav-link active" href="Paciente.html">Pacientes</a>
                </li>
                <li class="nav-item">
                <a class="nav-link active" href="Servicio.html">Servicios</a>
                </li>
            </ul>
            <form class="d-flex">
                <input class="form-control me-sm-2" type="search" placeholder="Buscar" style="background-color: rgb(248, 248, 250);">
                <button id="btnBuscar" class="btn btn-secondary my-2 my-sm-0" type="submit">Buscar</button>
            </form>
            <button class="btn btn-primary" onclick="CerrarSesion()" style="margin: 30px;">Cerrar Sesión</button>
            </div>
        </div>
    </nav>
    <header >
        <h1>Registro del Odontólogo</h1>
        <p>Por favor completar los campos con sus respectivos datos</p>
    </header>

    <div class="container mt-4">
        <div class="card shadow p-4 mx-auto" style="max-width: 600px; margin-bottom: 30px;">
            <form id="formRegistro" action="" method="post">
                <label for="tipoDocumento" class="d-block mb-3">Tipo de Documento
                    <select id="tipoDocumento" name="tipoDocumento" class="form-select" style="border: 2px solid #d0e2ff; border-radius: 12px;">
                        <option value="">Seleccione el tipo de documento</option>
                        <option value="CC">Cédula de Ciudadanía</option>
                        <option value="CE">Cédula de Extranjería</option>
                    </select>
                </label>
                <label for="numDocumento" class="d-block mb-3">Número de Documento
                    <input id="numDocumento" name="numDocumento" type="text" class="form-control" style="border: 2px solid #d0e2ff; border-radius: 12px;" required />
                </label>
                <label for="primerNombre" class="d-block mb-3">Primer Nombre
                    <input id="primerNombre" name="primerNombre" type="text" class="form-control" style="border: 2px solid #d0e2ff; border-radius: 12px;" required />
                </label>
                <label for="segundoNombre" class="d-block mb-3">Segundo Nombre
                    <input id="segundoNombre" name="segundoNombre" type="text" class="form-control" style="border: 2px solid #d0e2ff; border-radius: 12px;" required />
                </label>
                <label for="primerApellido" class="d-block mb-3">Primer Apellido
                    <input id="primerApellido" name="primerApellido" type="text" class="form-control" style="border: 2px solid #d0e2ff; border-radius: 12px;" required />
                </label>
                <label for="segundoApellido" class="d-block mb-3">Segundo Apellido
                    <input id="segundoApellido" name="segundoApellido" type="text" class="form-control" style="border: 2px solid #d0e2ff; border-radius: 12px;" required />
                </label>
                <label for="numCel" class="d-block mb-3">Número de Celular
                    <input id="numCel" name="numCel" type="tel" pattern="3[0-9]{9}" placeholder="3xxxxxxxxx" class="form-control" style="border: 2px solid #d0e2ff; border-radius: 12px;" required />
                </label>
                <label for="correo" class="d-block mb-3">Correo
                    <input id="correo" name="correo" type="email" class="form-control" style="border: 2px solid #d0e2ff; border-radius: 12px;" required />
                </label>
                <label for="especializacion" class="d-block mb-3">Especialización
                    <select id="especializacion" name="especializacion" class="form-select" style="border: 2px solid #d0e2ff; border-radius: 12px;">
                        <option value="">Seleccione la especialización</option>
                        <option value="Ortodoncia">Ortodoncia</option>
                        <option value="atencionGeneral">Atención General</option>
                        <option value="estetica">Estética</option>
                    </select>
                </label>
                <label for="password" class="d-block mb-3" >Contraseña
                    <input id="password" name="password" type="password" placeholder="********" class="form-control" style="border: 2px solid #d0e2ff; border-radius: 12px;" required />
                </label>
                <div class="d-flex justify-content-end gap-2">
                    <button id="btnConsultar" type="button"  class="btn btn-primary">Consultar</button>
                    <button id="btnRegistrar" type="submit"  class="btn btn-primary">Registrar</button>
                    <button id="btnActualizar" type="submit"  class="btn btn-primary">Actualizar</button>
                    <button id="btnEliminar" type="submit"  class="btn btn-primary">Eliminar</button>
                    <button id="btnCancelar" type="button" class="btn btn-secondary" onclick="cancelar()">Cancelar</button>
                </div>
            </form>
            <script>
                function CerrarSesion(){
                    alert("Sesión Cerrada \n Usted ha salido del sistema exitosamente");
                    window.location.href="Login.html"
                }
                function cancelar(){
                    document.querySelector("form").reset();
                }
            </script>
        </div>
    </div>
</body>
</html>
